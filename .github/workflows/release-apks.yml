name: Build and Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Discover Android app modules
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t declared_modules < <(
            grep -E "^[[:space:]]*include[[:space:]]" settings.gradle \
              | grep -oE "'[^']+'" \
              | tr -d "'" \
              || true
          )

          app_modules=()
          gradle_tasks=()
          for module_ref in "${declared_modules[@]}"; do
            module_path="${module_ref#:}"
            module_dir="${module_path//:/\/}"
            build_file="$module_dir/build.gradle"
            if [[ ! -f "$build_file" && -f "$module_dir/build.gradle.kts" ]]; then
              build_file="$module_dir/build.gradle.kts"
            fi

            if [[ -f "$build_file" ]] && grep -Eq "com\.android\.application" "$build_file"; then
              app_modules+=("$module_dir")
              gradle_tasks+=("${module_ref}:assembleRelease")
            fi
          done

          if [[ ${#app_modules[@]} -eq 0 ]]; then
            echo "Nenhum módulo Android application foi detectado."
            exit 1
          fi

          echo "tasks=${gradle_tasks[*]}" >> "$GITHUB_OUTPUT"
          echo "modules<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${app_modules[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: ./gradlew ${{ steps.discover.outputs.tasks }}

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          release_body_file="dist/release-body.txt"
          : > "$release_body_file"
          echo "APKs gerados automaticamente:" >> "$release_body_file"
          release_version=""

          while IFS= read -r module_dir; do
            [[ -z "$module_dir" ]] && continue

            build_file="$module_dir/build.gradle"
            if [[ ! -f "$build_file" && -f "$module_dir/build.gradle.kts" ]]; then
              build_file="$module_dir/build.gradle.kts"
            fi

            version_name=$(sed -nE "s/.*versionName[[:space:]]+[\"']([^\"']+)[\"'].*/\1/p" "$build_file" | head -n 1)
            version_code=$(sed -nE "s/.*versionCode[[:space:]]+([0-9]+).*/\1/p" "$build_file" | head -n 1)

            if [[ -z "$version_name" ]]; then
              echo "versionName não encontrado em $build_file"
              exit 1
            fi
            [[ -z "$version_code" ]] && version_code="0"

            if [[ -z "$release_version" ]]; then
              release_version="$version_name"
            elif [[ "$release_version" != "$version_name" ]]; then
              echo "Versões divergentes entre módulos Android: $release_version e $version_name"
              exit 1
            fi

            apk_path=$(find "$module_dir/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)
            if [[ -z "$apk_path" ]]; then
              echo "APK de release não encontrado para $module_dir"
              exit 1
            fi

            module_slug="${module_dir//\//-}"
            artifact_path="dist/${module_slug}-v${version_name}+${version_code}.apk"
            cp "$apk_path" "$artifact_path"

            echo "$artifact_path" >> dist/release-files.txt
            echo "- $module_slug v$version_name (code $version_code)" >> "$release_body_file"
          done <<< "${{ steps.discover.outputs.modules }}"

          if [[ -z "$release_version" ]]; then
            echo "Não foi possível definir a versão da release."
            exit 1
          fi

          release_tag="$release_version"
          if [[ "$release_tag" != v* ]]; then
            release_tag="v$release_tag"
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat dist/release-files.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          cat "$release_body_file" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: Release ${{ steps.artifacts.outputs.release_tag }}
          body: ${{ steps.artifacts.outputs.release_body }}
          files: ${{ steps.artifacts.outputs.files }}
